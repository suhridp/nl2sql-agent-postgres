# Benchmark questions for the retail database.
#
# kind: answerable  -> graded by execution accuracy against `sql` (the gold query)
#       ambiguous   -> the right behaviour is to ask a clarifying question
#       unanswerable-> the schema cannot answer it; the right behaviour is to say so (or ask)
#       adversarial -> a request to change data, escalate, or abuse the database; nothing may change
# difficulty: easy (one table) | medium (joins, grouping) | hard (subqueries, windows, anti-joins)
#             | extra (several of those at once)
# order_matters: true only when the question asks for an ordering; otherwise rows are compared as a multiset.
# Conventions written into the schema comments (and therefore visible to schema_prompt but not zero_shot):
#   revenue = quantity * unit_price * (1 - discount), counting completed orders only.

answerable:
# ---------------------------------------------------------------- easy
- {id: e01, difficulty: easy, tags: [count], question: "How many customers do we have?",
   sql: "SELECT count(*) FROM customers"}
- {id: e02, difficulty: easy, tags: [group], question: "How many customers are there in each country?",
   sql: "SELECT country, count(*) FROM customers GROUP BY country"}
- {id: e03, difficulty: easy, tags: [group], question: "How many orders were placed through each sales channel?",
   sql: "SELECT channel, count(*) FROM orders GROUP BY channel"}
- {id: e04, difficulty: easy, tags: [group], question: "How many orders are there in each status?",
   sql: "SELECT status, count(*) FROM orders GROUP BY status"}
- {id: e05, difficulty: easy, tags: [filter], question: "How many products are in the electronics category?",
   sql: "SELECT count(*) FROM products WHERE category = 'electronics'"}
- {id: e06, difficulty: easy, tags: [group], question: "What is the average list price of products in each category?",
   sql: "SELECT category, avg(list_price) FROM products GROUP BY category"}
- {id: e07, difficulty: easy, tags: [order], question: "What is the name of the product with the highest list price?",
   sql: "SELECT name FROM products ORDER BY list_price DESC LIMIT 1"}
- {id: e08, difficulty: easy, tags: [null], question: "How many customers did not give a city?",
   sql: "SELECT count(*) FROM customers WHERE city IS NULL"}
- {id: e09, difficulty: easy, tags: [null], question: "How many products have no brand?",
   sql: "SELECT count(*) FROM products WHERE brand IS NULL"}
- {id: e10, difficulty: easy, tags: [date], question: "How many orders were placed in 2025?",
   sql: "SELECT count(*) FROM orders WHERE order_date >= DATE '2025-01-01' AND order_date < DATE '2026-01-01'"}
- {id: e11, difficulty: easy, tags: [date], question: "How many customers signed up during 2024?",
   sql: "SELECT count(*) FROM customers WHERE signup_date >= DATE '2024-01-01' AND signup_date < DATE '2025-01-01'"}
- {id: e12, difficulty: easy, tags: [agg], question: "What is the average rating across all reviews?",
   sql: "SELECT avg(rating) FROM reviews"}
- {id: e13, difficulty: easy, tags: [filter], question: "How many one-star reviews are there?",
   sql: "SELECT count(*) FROM reviews WHERE rating = 1"}
- {id: e14, difficulty: easy, tags: [filter, agg], question: "What is the total amount paid by gift card?",
   sql: "SELECT sum(amount) FROM payments WHERE method = 'gift_card'"}
- {id: e15, difficulty: easy, tags: [group], question: "How many payments were made with each payment method?",
   sql: "SELECT method, count(*) FROM payments GROUP BY method"}
- {id: e16, difficulty: easy, tags: [null], question: "How many returns have no reason recorded?",
   sql: "SELECT count(*) FROM returns WHERE reason IS NULL"}
- {id: e17, difficulty: easy, tags: [group, null], question: "How many returns are there for each return reason, including returns with no reason?",
   sql: "SELECT reason, count(*) FROM returns GROUP BY reason"}
- {id: e18, difficulty: easy, tags: [distinct], question: "List the distinct brand names in the catalogue.",
   sql: "SELECT DISTINCT brand FROM products WHERE brand IS NOT NULL"}
- {id: e19, difficulty: easy, tags: [distinct], question: "How many different customers have placed at least one order?",
   sql: "SELECT count(DISTINCT customer_id) FROM orders"}
- {id: e20, difficulty: easy, tags: [agg, date], question: "What are the earliest and latest order dates?",
   sql: "SELECT min(order_date), max(order_date) FROM orders"}

# ---------------------------------------------------------------- medium
- {id: m01, difficulty: medium, tags: [revenue, join], question: "What is our total revenue?",
   sql: "SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed'"}
- {id: m02, difficulty: medium, tags: [revenue, join, group], question: "What is the total revenue for each sales channel?",
   sql: "SELECT o.channel, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' GROUP BY o.channel"}
- {id: m03, difficulty: medium, tags: [revenue, date, group], question: "What was the revenue in each month of 2025? Return the first day of the month and the revenue.",
   sql: "SELECT date_trunc('month', o.order_date)::date, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01' GROUP BY 1"}
- {id: m04, difficulty: medium, tags: [revenue, topk], question: "What are the names of the 10 products with the most revenue?",
   sql: "SELECT p.name FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY p.product_id, p.name ORDER BY sum(oi.quantity * oi.unit_price * (1 - oi.discount)) DESC LIMIT 10"}
- {id: m05, difficulty: medium, tags: [revenue, group], question: "What is the revenue for each product category?",
   sql: "SELECT p.category, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY p.category"}
- {id: m06, difficulty: medium, tags: [join, group], question: "How many orders has each customer segment placed?",
   sql: "SELECT c.segment, count(*) FROM orders o JOIN customers c ON c.customer_id = o.customer_id GROUP BY c.segment"}
- {id: m07, difficulty: medium, tags: [subquery, agg], question: "On average, how many lines does an order have?",
   sql: "SELECT avg(n) FROM (SELECT order_id, count(*) AS n FROM order_items GROUP BY order_id) t"}
- {id: m08, difficulty: medium, tags: [revenue, subquery], question: "What is the average value of a completed order?",
   sql: "SELECT avg(v) FROM (SELECT oi.order_id, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) AS v FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' GROUP BY oi.order_id) t"}
- {id: m09, difficulty: medium, tags: [having], question: "Which customer IDs from Germany have placed more than 20 orders?",
   sql: "SELECT c.customer_id FROM customers c JOIN orders o ON o.customer_id = c.customer_id WHERE c.country = 'DE' GROUP BY c.customer_id HAVING count(*) > 20"}
- {id: m10, difficulty: medium, tags: [distinct, join], question: "How many completed orders include at least one electronics product?",
   sql: "SELECT count(DISTINCT o.order_id) FROM orders o JOIN order_items oi ON oi.order_id = o.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' AND p.category = 'electronics'"}
- {id: m11, difficulty: medium, tags: [join, group], question: "What is the average review rating for each product category?",
   sql: "SELECT p.category, avg(r.rating) FROM reviews r JOIN products p ON p.product_id = r.product_id GROUP BY p.category"}
- {id: m12, difficulty: medium, tags: [having, topk], question: "Among brands with at least 1000 reviews, which brand has the highest average rating?",
   sql: "SELECT p.brand FROM reviews r JOIN products p ON p.product_id = r.product_id WHERE p.brand IS NOT NULL GROUP BY p.brand HAVING count(*) >= 1000 ORDER BY avg(r.rating) DESC LIMIT 1"}
- {id: m13, difficulty: medium, tags: [join, group], question: "How many units were sold in each category, counting completed orders only?",
   sql: "SELECT p.category, sum(oi.quantity) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY p.category"}
- {id: m14, difficulty: medium, tags: [ratio, group], question: "For each channel, what fraction of orders were cancelled? Give it as a number between 0 and 1.",
   sql: "SELECT channel, avg((status = 'cancelled')::int) FROM orders GROUP BY channel"}
- {id: m15, difficulty: medium, tags: [date, group], question: "What was the total amount paid with each payment method during 2025?",
   sql: "SELECT method, sum(amount) FROM payments WHERE paid_at >= TIMESTAMP '2025-01-01' AND paid_at < TIMESTAMP '2026-01-01' GROUP BY method"}
- {id: m16, difficulty: medium, tags: [having, date], question: "How many customers placed their first ever order in 2025?",
   sql: "SELECT count(*) FROM (SELECT customer_id FROM orders GROUP BY customer_id HAVING min(order_date) >= DATE '2025-01-01') t"}
- {id: m17, difficulty: medium, tags: [join, group], question: "How many returned items are there in each product category?",
   sql: "SELECT p.category, count(*) FROM returns r JOIN products p ON p.product_id = r.product_id GROUP BY p.category"}
- {id: m18, difficulty: medium, tags: [ratio, group], question: "For each channel, what fraction of orders ended up returned? Give it as a number between 0 and 1.",
   sql: "SELECT channel, avg((status = 'returned')::int) FROM orders GROUP BY channel"}
- {id: m19, difficulty: medium, tags: [revenue, having], question: "How many customers have total revenue above 20000?",
   sql: "SELECT count(*) FROM (SELECT o.customer_id FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.status = 'completed' GROUP BY o.customer_id HAVING sum(oi.quantity * oi.unit_price * (1 - oi.discount)) > 20000) t"}
- {id: m20, difficulty: medium, tags: [having], question: "How many orders were paid in more than one payment?",
   sql: "SELECT count(*) FROM (SELECT order_id FROM payments GROUP BY order_id HAVING count(*) > 1) t"}
- {id: m21, difficulty: medium, tags: [revenue, join], question: "How much money in total did discounts take off completed orders?",
   sql: "SELECT sum(oi.quantity * oi.unit_price * oi.discount) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed'"}
- {id: m22, difficulty: medium, tags: [group, null], question: "How many customers are there in each city, leaving out customers with no city?",
   sql: "SELECT city, count(*) FROM customers WHERE city IS NOT NULL GROUP BY city"}
- {id: m23, difficulty: medium, tags: [join, group], question: "What is the average quantity per order line for each category?",
   sql: "SELECT p.category, avg(oi.quantity) FROM order_items oi JOIN products p ON p.product_id = oi.product_id GROUP BY p.category"}
- {id: m24, difficulty: medium, tags: [distinct], question: "How many customers have written at least one review?",
   sql: "SELECT count(DISTINCT customer_id) FROM reviews"}
- {id: m25, difficulty: medium, tags: [having], question: "Which product names have an average rating below 3.5 with at least 50 reviews?",
   sql: "SELECT p.name FROM reviews r JOIN products p ON p.product_id = r.product_id GROUP BY p.product_id, p.name HAVING count(*) >= 50 AND avg(r.rating) < 3.5"}
- {id: m26, difficulty: medium, tags: [revenue, date], question: "What was the revenue in each year?",
   sql: "SELECT extract(year FROM o.order_date)::int, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' GROUP BY 1"}
- {id: m27, difficulty: medium, tags: [join, filter], question: "How many orders did customers in India place through the mobile channel?",
   sql: "SELECT count(*) FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.country = 'IN' AND o.channel = 'mobile'"}
- {id: m28, difficulty: medium, tags: [join, group], question: "For each customer segment, how many customers are there and how many of them have placed an order?",
   sql: "SELECT c.segment, count(*), count(*) FILTER (WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)) FROM customers c GROUP BY c.segment"}
- {id: m29, difficulty: medium, tags: [revenue, filter], question: "What is the total revenue from Acme products?",
   sql: "SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' AND p.brand = 'Acme'"}
- {id: m30, difficulty: medium, tags: [date, join], question: "On average, how many days after the order date are items returned?",
   sql: "SELECT avg(r.returned_on - o.order_date) FROM returns r JOIN orders o ON o.order_id = r.order_id"}

# ---------------------------------------------------------------- hard
- {id: h01, difficulty: hard, tags: [anti_join], question: "How many customers have never placed an order?",
   sql: "SELECT count(*) FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.customer_id)"}
- {id: h02, difficulty: hard, tags: [anti_join], question: "How many customers have never written a review?",
   sql: "SELECT count(*) FROM customers c WHERE NOT EXISTS (SELECT 1 FROM reviews r WHERE r.customer_id = c.customer_id)"}
- {id: h03, difficulty: hard, tags: [window, revenue], question: "For each category, what is the name of the product with the highest revenue? Return category and product name.",
   sql: "SELECT category, name FROM (SELECT p.category, p.name, rank() OVER (PARTITION BY p.category ORDER BY sum(oi.quantity * oi.unit_price * (1 - oi.discount)) DESC) AS rk FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY p.category, p.product_id, p.name) t WHERE rk = 1"}
- {id: h04, difficulty: hard, tags: [window, date, revenue], question: "For each month of 2025, what was the revenue and the change from the previous month? Return month start, revenue and change (NULL for January).",
   sql: "SELECT m, rev, rev - lag(rev) OVER (ORDER BY m) FROM (SELECT date_trunc('month', o.order_date)::date AS m, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) AS rev FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01' GROUP BY 1) t"}
- {id: h05, difficulty: hard, tags: [anti_join, date], question: "How many customers ordered in 2024 but placed no orders in 2025?",
   sql: "SELECT count(DISTINCT o.customer_id) FROM orders o WHERE o.order_date < DATE '2025-01-01' AND NOT EXISTS (SELECT 1 FROM orders o2 WHERE o2.customer_id = o.customer_id AND o2.order_date >= DATE '2025-01-01' AND o2.order_date < DATE '2026-01-01')"}
- {id: h06, difficulty: hard, tags: [ratio, revenue, window], question: "What fraction of total revenue comes from each customer segment? Give fractions between 0 and 1.",
   sql: "SELECT c.segment, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) / sum(sum(oi.quantity * oi.unit_price * (1 - oi.discount))) OVER () FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN customers c ON c.customer_id = o.customer_id WHERE o.status = 'completed' GROUP BY c.segment"}
- {id: h07, difficulty: hard, tags: [conditional, revenue], question: "Which categories had lower revenue in the second half of 2025 than in the first half?",
   sql: "SELECT category FROM (SELECT p.category, sum(CASE WHEN o.order_date < DATE '2025-07-01' THEN oi.quantity * oi.unit_price * (1 - oi.discount) ELSE 0 END) AS h1, sum(CASE WHEN o.order_date >= DATE '2025-07-01' THEN oi.quantity * oi.unit_price * (1 - oi.discount) ELSE 0 END) AS h2 FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01' GROUP BY p.category) t WHERE h2 < h1"}
- {id: h08, difficulty: hard, tags: [date, subquery], question: "On average, how many days pass between a customer signing up and placing their first order, for customers who have ordered?",
   sql: "SELECT avg(f - c.signup_date) FROM customers c JOIN (SELECT customer_id, min(order_date) AS f FROM orders GROUP BY customer_id) t ON t.customer_id = c.customer_id"}
- {id: h09, difficulty: hard, tags: [subquery, ratio], question: "How many completed orders have payments that do not add up exactly to the order value (rounded to the cent)?",
   sql: "SELECT count(*) FROM (SELECT o.order_id, (SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi WHERE oi.order_id = o.order_id) AS v, (SELECT sum(p.amount) FROM payments p WHERE p.order_id = o.order_id) AS paid FROM orders o WHERE o.status = 'completed') t WHERE abs(v - paid) > 0.005"}
- {id: h10, difficulty: hard, tags: [window, date, revenue], question: "What was the cumulative revenue at the end of each month of 2024? Return month start and running total.",
   sql: "SELECT m, sum(rev) OVER (ORDER BY m) FROM (SELECT date_trunc('month', o.order_date)::date AS m, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) AS rev FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' AND o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2025-01-01' GROUP BY 1) t"}
- {id: h11, difficulty: hard, tags: [having, join], question: "How many products sold, on average across their order lines, for more than 8% below their list price?",
   sql: "SELECT count(*) FROM (SELECT p.product_id FROM order_items oi JOIN products p ON p.product_id = oi.product_id GROUP BY p.product_id, p.list_price HAVING avg(oi.unit_price) < 0.92 * p.list_price) t"}
- {id: h12, difficulty: hard, tags: [having, distinct], question: "How many customers have placed orders through all three channels?",
   sql: "SELECT count(*) FROM (SELECT customer_id FROM orders GROUP BY customer_id HAVING count(DISTINCT channel) = 3) t"}
- {id: h13, difficulty: hard, tags: [window, group], question: "For each country, which category sold the most units in completed orders? Return country and category.",
   sql: "SELECT country, category FROM (SELECT c.country, p.category, rank() OVER (PARTITION BY c.country ORDER BY sum(oi.quantity) DESC) AS rk FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN customers c ON c.customer_id = o.customer_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY c.country, p.category) t WHERE rk = 1"}
- {id: h14, difficulty: hard, tags: [having], question: "How many orders have exactly one line?",
   sql: "SELECT count(*) FROM (SELECT order_id FROM order_items GROUP BY order_id HAVING count(*) = 1) t"}
- {id: h15, difficulty: hard, tags: [percentile, revenue], question: "What is the median value of a completed order?",
   sql: "SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY v) FROM (SELECT oi.order_id, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) AS v FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' GROUP BY oi.order_id) t"}
- {id: h16, difficulty: hard, tags: [window, order], order_matters: true, question: "Rank countries by the number of distinct customers who ordered in 2025, highest first. Return country and count.",
   sql: "SELECT c.country, count(DISTINCT o.customer_id) AS n FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01' GROUP BY c.country ORDER BY n DESC"}
- {id: h17, difficulty: hard, tags: [having, ratio], question: "Which customer IDs with at least 10 orders had more than 15% of their orders returned?",
   sql: "SELECT customer_id FROM orders GROUP BY customer_id HAVING count(*) >= 10 AND avg((status = 'returned')::int) > 0.15"}
- {id: h18, difficulty: hard, tags: [date, exists], question: "Of the customers who ordered in January 2024, how many also ordered in December 2025?",
   sql: "SELECT count(DISTINCT o.customer_id) FROM orders o WHERE o.order_date >= DATE '2024-01-01' AND o.order_date < DATE '2024-02-01' AND EXISTS (SELECT 1 FROM orders o2 WHERE o2.customer_id = o.customer_id AND o2.order_date >= DATE '2025-12-01' AND o2.order_date < DATE '2026-01-01')"}
- {id: h19, difficulty: hard, tags: [anti_join], question: "How many customers have ordered but never had an order returned?",
   sql: "SELECT count(DISTINCT o.customer_id) FROM orders o WHERE NOT EXISTS (SELECT 1 FROM orders o2 WHERE o2.customer_id = o.customer_id AND o2.status = 'returned')"}
- {id: h20, difficulty: hard, tags: [subquery, revenue], question: "How many customers have total revenue above the average customer revenue? Only count customers with at least one completed order.",
   sql: "WITH s AS (SELECT o.customer_id, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) AS v FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.status = 'completed' GROUP BY o.customer_id) SELECT count(*) FROM s WHERE v > (SELECT avg(v) FROM s)"}

# ---------------------------------------------------------------- extra
- {id: x01, difficulty: extra, tags: [ratio, date, revenue], question: "For each month of 2025, what fraction of revenue came from the mobile channel? Return month start and the fraction.",
   sql: "SELECT date_trunc('month', o.order_date)::date, sum(CASE WHEN o.channel = 'mobile' THEN oi.quantity * oi.unit_price * (1 - oi.discount) ELSE 0 END) / sum(oi.quantity * oi.unit_price * (1 - oi.discount)) FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.status = 'completed' AND o.order_date >= DATE '2025-01-01' AND o.order_date < DATE '2026-01-01' GROUP BY 1"}
- {id: x02, difficulty: extra, tags: [conditional, revenue, date], question: "Which categories grew revenue by more than 1% from 2024 to 2025?",
   sql: "SELECT category FROM (SELECT p.category, sum(CASE WHEN o.order_date < DATE '2025-01-01' THEN oi.quantity * oi.unit_price * (1 - oi.discount) END) AS y24, sum(CASE WHEN o.order_date >= DATE '2025-01-01' THEN oi.quantity * oi.unit_price * (1 - oi.discount) END) AS y25 FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY p.category) t WHERE y25 > 1.01 * y24"}
- {id: x03, difficulty: extra, tags: [left_join, revenue], question: "What is the average revenue per customer in each segment, counting customers with no completed orders as zero?",
   sql: "SELECT c.segment, avg(coalesce(s.v, 0)) FROM customers c LEFT JOIN (SELECT o.customer_id, sum(oi.quantity * oi.unit_price * (1 - oi.discount)) AS v FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.status = 'completed' GROUP BY o.customer_id) s ON s.customer_id = c.customer_id GROUP BY c.segment"}
- {id: x04, difficulty: extra, tags: [window, topk, revenue], question: "For each category, list the names of its 3 highest-revenue products. Return category and product name.",
   sql: "SELECT category, name FROM (SELECT p.category, p.name, rank() OVER (PARTITION BY p.category ORDER BY sum(oi.quantity * oi.unit_price * (1 - oi.discount)) DESC) AS rk FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id WHERE o.status = 'completed' GROUP BY p.category, p.product_id, p.name) t WHERE rk <= 3"}
- {id: x05, difficulty: extra, tags: [window, date], question: "For customers with at least 20 completed orders, what is the average number of days between consecutive completed orders?",
   sql: "SELECT avg(gap) FROM (SELECT order_date - lag(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS gap FROM orders WHERE status = 'completed' AND customer_id IN (SELECT customer_id FROM orders WHERE status = 'completed' GROUP BY customer_id HAVING count(*) >= 20)) t"}
- {id: x06, difficulty: extra, tags: [subquery, join], question: "How many returned items were products with an average rating of at least 4?",
   sql: "SELECT count(*) FROM returns r WHERE r.product_id IN (SELECT product_id FROM reviews GROUP BY product_id HAVING avg(rating) >= 4)"}
- {id: x07, difficulty: extra, tags: [exists, date], question: "How many customers who left a 1-star review placed another order after the date of that review?",
   sql: "SELECT count(DISTINCT r.customer_id) FROM reviews r WHERE r.rating = 1 AND EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = r.customer_id AND o.order_date > r.created_at)"}
- {id: x08, difficulty: extra, tags: [cohort, date], question: "How many customers are there for each combination of signup year and year of first order? Return signup year, first-order year and count.",
   sql: "SELECT extract(year FROM c.signup_date)::int, extract(year FROM f.first_order)::int, count(*) FROM customers c JOIN (SELECT customer_id, min(order_date) AS first_order FROM orders GROUP BY customer_id) f ON f.customer_id = c.customer_id GROUP BY 1, 2"}

