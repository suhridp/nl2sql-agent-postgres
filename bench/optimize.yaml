# Naive-but-correct formulations, the kind people (and models) write, used to test whether
# rewrites help on PostgreSQL 16. `expect` records the rewrite family we suspect could help and is
# NOT used by the optimizer; several are included because we expect the planner to already cope,
# and a few because a rewrite would be WRONG (o06), to check the safety rules.
- {id: o01, expect: sargable_dates, sql: "SELECT count(*) FROM orders WHERE extract(year FROM order_date) = 2025 AND channel = 'store'"}
- {id: o02, expect: sargable_dates, sql: "SELECT sum(p.amount) FROM payments p JOIN orders o ON o.order_id = p.order_id WHERE date_trunc('month', o.order_date) = DATE '2025-03-01'"}
- {id: o03, expect: sargable_dates, sql: "SELECT count(*) FROM orders WHERE date_part('year', order_date) = 2024 AND date_part('month', order_date) = 2"}
- {id: o04, expect: sargable_dates, sql: "SELECT count(*) FROM orders WHERE order_date + 30 > DATE '2025-12-25'"}
- {id: o05, expect: having_to_where, sql: "SELECT customer_id, count(*) FROM orders GROUP BY customer_id, status HAVING status = 'returned' AND count(*) > 3"}
- {id: o06, expect: unsafe_not_in, sql: "SELECT count(*) FROM customers WHERE city NOT IN (SELECT city FROM customers WHERE country = 'GB')"}
- {id: o07, expect: not_in_to_not_exists, sql: "SELECT count(*) FROM customers WHERE customer_id NOT IN (SELECT customer_id FROM orders)"}
- {id: o08, expect: planner_already_handles, sql: "SELECT count(*) FROM orders WHERE customer_id IN (SELECT customer_id FROM customers WHERE country = 'JP')"}
- {id: o09, expect: correlated_subquery, sql: "SELECT c.customer_id, (SELECT count(*) FROM orders o WHERE o.customer_id = c.customer_id) AS n FROM customers c WHERE c.country = 'FR'"}
- {id: o10, expect: correlated_subquery, sql: "SELECT count(*) FROM products p WHERE p.list_price > (SELECT avg(p2.list_price) FROM products p2 WHERE p2.category = p.category)"}
- {id: o11, expect: correlated_subquery, sql: "SELECT count(*) FROM order_items oi WHERE oi.order_id <= 1000 AND oi.unit_price < (SELECT avg(oi2.unit_price) FROM order_items oi2 WHERE oi2.product_id = oi.product_id) * 0.95"}
- {id: o12, expect: or_to_union, sql: "SELECT count(*) FROM orders WHERE customer_id = 42 OR order_date = DATE '2025-05-05'"}
- {id: o13, expect: cte_materialization, sql: "WITH t AS MATERIALIZED (SELECT * FROM orders) SELECT count(*) FROM t WHERE customer_id = 7"}
- {id: o14, expect: cte_materialization, sql: "WITH s AS (SELECT customer_id, count(*) AS n FROM orders GROUP BY customer_id) SELECT (SELECT count(*) FROM s WHERE n > 20), (SELECT max(n) FROM s)"}
- {id: o15, expect: planner_already_handles, sql: "SELECT count(*) FROM customers c LEFT JOIN orders o ON o.customer_id = c.customer_id WHERE o.order_id IS NOT NULL"}
- {id: o16, expect: distinct_join, sql: "SELECT DISTINCT c.customer_id FROM customers c JOIN orders o ON o.customer_id = c.customer_id WHERE o.channel = 'store' AND c.country = 'DE'"}
