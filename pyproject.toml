[project]
name = "sql-agent"
version = "0.2.0"
description = "Natural-language-to-SQL agent for PostgreSQL with layered guardrails and verified, statistically gated query optimization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Suhrid Behari Paul" }]
dependencies = ["sqlglot>=25", "PyYAML>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools]
packages = ["sql_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B023"]

[tool.ruff.lint.per-file-ignores]
"sql_agent/dashboard.py" = ["E501"]
"sql_agent/agent.py" = ["E501"]   # the system prompt is kept as written
